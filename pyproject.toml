[project]
name = "signal-scanner"
version = "0.1.0"
description = "Rule-based stock/crypto screener with alerts — console, Telegram, MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[project.scripts]
signal-scanner = "signal_scanner.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_scanner*"]
