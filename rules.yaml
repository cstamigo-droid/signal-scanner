# signal-scanner ruleset. Edit freely — no code changes needed.
# A rule fires when ALL its conditions are true (AND).
# Available indicators: price, pct_change, rsi, sma_fast, sma_slow, sma_cross,
#                       vol_ratio, pct_from_52w_high, pct_from_52w_low
# Ops: <  <=  >  >=  ==  !=
rules:
  - name: oversold
    when:
      - {indicator: rsi, op: "<", value: 30}

  - name: overbought
    when:
      - {indicator: rsi, op: ">", value: 70}

  - name: golden_cross
    when:
      - {indicator: sma_cross, op: "==", value: golden}

  - name: death_cross
    when:
      - {indicator: sma_cross, op: "==", value: death}

  - name: volume_spike_up
    when:
      - {indicator: vol_ratio, op: ">", value: 2.0}
      - {indicator: pct_change, op: ">", value: 1.0}

  - name: breakout_near_52w_high
    when:
      - {indicator: pct_from_52w_high, op: ">", value: -2.0}
      - {indicator: pct_change, op: ">", value: 0.0}
